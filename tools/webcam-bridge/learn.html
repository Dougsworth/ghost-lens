<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHOST — Learn by doing</title>
<style>:root{font-family:ui-sans-serif,system-ui;background:#f4f0e7;color:#171c25}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,70px);font-weight:400;line-height:1.05;margin:25px 0 10px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#465b84}.intro{color:#526071;max-width:620px}.panel{background:#fffdf8;border:1px solid #dedbd1;border-radius:22px;padding:25px;margin:22px 0;box-shadow:0 8px 30px #27304a09}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{font:inherit;padding:13px;border-radius:12px;border:1px solid #c8ccd2}input{flex:1;min-width:180px;background:#fff}button{background:#244fba;color:#fff;cursor:pointer;border-color:#244fba}button.secondary{background:#f5f7fa;color:#253453;border-color:#d9dfe9}button:focus-visible,input:focus-visible{outline:3px solid #e0a85c}.muted{color:#697383;font-size:14px}#steps{display:flex;gap:8px;flex-wrap:wrap}#steps button{padding:9px 12px}#steps button.active{background:#101a2c}#practice{min-height:220px;position:relative;border:1px dashed #c6cdd7;border-radius:16px;background:#faf9f5;display:grid;place-items:center;overflow:hidden}canvas{width:100%;height:280px;touch-action:none}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;color:#1b2a44;border-color:#c9d1db}.choice.selected{border-color:#244fba;background:#e8edf7}.choice.correct{border-color:#31775b;background:#e4f3ea}.choice.wrong{border-color:#ad5047;background:#faeae8}.activity-inner{width:min(100%,600px);padding:18px}.model-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}.model-controls button{padding:8px 12px}.model-note{text-align:center;font-size:13px;color:#586779}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-grid button{min-width:0;overflow-wrap:anywhere}.match-grid button:disabled{opacity:.5}.model-canvas{background:#f0f3f8;border-radius:12px;cursor:grab}#model{width:100%;height:290px;display:block}#feedback{min-height:24px;color:#345b49}a{color:#244fba}label{display:block;margin:8px 0}small{color:#667} .pill{background:#e8edf7;color:#244fba;border-radius:30px;padding:6px 12px;font-size:12px}</style>
<main><header><strong>GHOST <span class="pill">Living Notebook</span></strong><nav><a href="library.html">My Learning</a> · <a href="room.html">Study Together</a></nav></header>
<h1>Learn by doing.</h1><p class="intro">Open a saved course. Trace, explore, practice and learn with a friend. Your next step is right where you left it.</p>
<section class="panel"><label for="learner">Learner</label><div class="row"><input id="learner" value="learner-a" aria-label="Learner ID"><select id="courses" aria-label="Saved courses"><option value="">Choose a saved course</option></select><button id="load">Open lesson</button></div><p class="muted" id="status">Loading your saved courses…</p></section>
<section class="panel" id="lesson" hidden><div class="eyebrow" id="kind"></div><h2 id="title"></h2><p id="instruction"></p><div id="steps"></div><div id="practice" aria-label="Interactive activity"></div><p id="feedback" role="status"></p><div class="row"><button id="hint" class="secondary">Give me a hint</button><button id="reset" class="secondary">Try again</button><button id="complete">Complete step →</button></div></section>
</main><script>
const $=id=>document.getElementById(id);let compiled=null,position=0,attempts=0,paint=[],passed=false;const api=async(path,options)=>{const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){try{let j=await api('/courses?learner='+encodeURIComponent($('learner').value));$('courses').innerHTML='<option value="">Choose a saved course</option>'+j.courses.map(c=>`<option value="${esc(c.courseId||c.id)}">${esc(c.skill||c.title||'Untitled course')}</option>`).join('');$('status').textContent=j.courses.length+' saved courses available.'}catch(e){$('status').textContent=e.message}}
async function load(){try{if(!$('courses').value)return;let j=await api('/learning/activity?courseId='+encodeURIComponent($('courses').value)+'&learner='+encodeURIComponent($('learner').value));compiled=j.lesson;position=Math.max(0,Math.min(compiled.activities.length-1,Number(j.progress?.step)||0));$('lesson').hidden=false;render()}catch(e){$('status').textContent=e.message}}
function render(){let a=compiled.activities[position];attempts=0;paint=[];passed=false;$('kind').textContent=a.type.replace('_',' ')+' · '+(position+1)+' / '+compiled.activities.length;$('title').textContent=a.title;$('instruction').textContent=a.instruction;$('feedback').textContent='';$('complete').disabled=a.completion==='correct_answer';$('steps').innerHTML='';compiled.activities.forEach((x,i)=>{let b=document.createElement('button');b.className=i===position?'active':'secondary';b.textContent=i+1;b.setAttribute('aria-label','Go to '+x.title);b.onclick=()=>{position=i;render()};$('steps').append(b)});let area=$('practice');area.replaceChildren();if(a.type==='TRACE'){let c=document.createElement('canvas');c.width=850;c.height=280;area.append(c);let ctx=c.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#244fba';const draw=()=>{ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#c6cbd5';ctx.lineWidth=5;for(let stroke of a.render.strokes||[]){ctx.beginPath();stroke.forEach((pt,i)=>{let x=(pt[0]+.5)*c.width,y=(.5-pt[1])*c.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.strokeStyle='#244fba';ctx.lineWidth=4;for(let stroke of paint){ctx.beginPath();stroke.forEach((pt,i)=>i?ctx.lineTo(...pt):ctx.moveTo(...pt));ctx.stroke()}};draw();let down=false;c.onpointerdown=e=>{down=true;paint.push([]);c.setPointerCapture(e.pointerId);add(e)};c.onpointermove=e=>{if(down)add(e)};c.onpointerup=()=>{down=false;$('feedback').textContent='Nice! Compare your line with the guide.'};function add(e){let r=c.getBoundingClientRect();paint[paint.length-1].push([(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]);draw()}}
else if(a.type==='EXPLORE_3D'){renderModel(area,a)}
else if(a.type==='QUIZ'){renderQuiz(area,a)}
else if(a.type==='MATCH'){renderMatch(area,a)}
else{let d=document.createElement('div');d.style.cssText='text-align:center;padding:35px';d.innerHTML='<div style="font-size:52px">✦</div><p>'+esc(a.instruction)+'</p><span class="muted">Practice this step, then mark it complete.</span>';area.append(d)}}
function markPassed(message){passed=true;$('complete').disabled=false;$('feedback').textContent=message}
function renderQuiz(area,a){const r=a.render||{},options=r.options||[],answer=r.answer;
 const wrap=document.createElement('div');wrap.className='activity-inner';area.append(wrap);
 const question=document.createElement('h3');question.textContent=r.question||a.instruction;wrap.append(question);
 if(!Array.isArray(options)||options.length<2||!Number.isInteger(answer)||answer<0||answer>=options.length){wrap.append('This course has no valid quiz choices.');$('complete').disabled=false;return}
 options.forEach((option,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+option;wrap.append(b);b.onclick=()=>{wrap.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(i===answer){b.classList.add('correct');markPassed('Correct! You can continue.')}else{b.classList.add('wrong');$('feedback').textContent='Not quite. Try another answer.'}}})}
function renderMatch(area,a){const r=a.render||{};let pairs=Array.isArray(r.pairs)?r.pairs:[];
 pairs=pairs.filter(p=>p&&typeof p.left==='string'&&typeof p.right==='string').slice(0,6);
 let wrap=document.createElement('div');wrap.className='activity-inner';area.append(wrap);
 if(pairs.length<2){let note=document.createElement('p');note.textContent='This lesson has no matching pairs yet. Continue when ready.';wrap.append(note);return}
 let help=document.createElement('p');help.textContent='Choose a term, then its matching explanation.';wrap.append(help);
 let grid=document.createElement('div');grid.className='match-grid';wrap.append(grid);
 let left=document.createElement('div'),right=document.createElement('div');grid.append(left,right);
 let selected=null,done=new Set();const shuffled=pairs.map((_,i)=>i).sort((a,b)=>((a*7+3)%pairs.length)-((b*7+3)%pairs.length));
 pairs.forEach((p,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=p.left;left.append(b);b.onclick=()=>{if(done.has(i))return;left.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=i}});
 shuffled.forEach(i=>{let b=document.createElement('button');b.className='choice';b.textContent=pairs[i].right;right.append(b);b.onclick=()=>{if(selected===null)return;if(selected===i){done.add(i);b.disabled=true;left.children[i].disabled=true;left.children[i].classList.remove('selected');selected=null;$('feedback').textContent=done.size+' of '+pairs.length+' pairs matched';if(done.size===pairs.length)markPassed('All pairs matched!')}else{$('feedback').textContent='Those do not match. Try again.'}}})}
function renderModel(area,a){const r=a.render||{};const wrap=document.createElement('div');wrap.className='activity-inner';area.append(wrap);
 const canvas=document.createElement('canvas');canvas.width=760;canvas.height=360;canvas.className='model-canvas';canvas.setAttribute('aria-label','Rotatable 3D diagram');wrap.append(canvas);
 const controls=document.createElement('div');controls.className='model-controls';wrap.append(controls);
 let yaw=.55,pitch=.32,zoom=1,drag=null;const objects=(Array.isArray(r.objects)&&r.objects.length?r.objects:[{id:'preview',shape:r.placeholder||'box',size:[1,1,1],pos:[0,0,0]}]).slice(0,12);
 const ctx=canvas.getContext('2d');const project=(p)=>{let [x,y,z]=p;let X=x*Math.cos(yaw)-z*Math.sin(yaw),Z=x*Math.sin(yaw)+z*Math.cos(yaw);let Y=y*Math.cos(pitch)-Z*Math.sin(pitch);return [canvas.width/2+X*85*zoom,canvas.height/2-Y*85*zoom]};
 function line(points,closed=false){if(!points.length)return;ctx.beginPath();points.forEach((p,i)=>{let q=project(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});if(closed)ctx.closePath();ctx.stroke()}
 function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#d4dce8';ctx.lineWidth=1;for(let i=-3;i<=3;i++){line([[i,0,-3],[i,0,3]]);line([[-3,0,i],[3,0,i]])}ctx.lineWidth=3;objects.forEach((o,i)=>{let pos=Array.isArray(o.pos)?o.pos:[0,0,0],size=Array.isArray(o.size)?o.size:[1,1,1];let [x,y,z]=[0,1,2].map(j=>Number(pos[j])||0),[w,h,d]=[0,1,2].map(j=>Math.max(.15,Math.min(3,Number(size[j])||1)));let shape=o.shape||'box';ctx.strokeStyle=['#244fba','#b05e40','#327a70','#755b9c'][i%4];let p=(dx,dy,dz)=>[x+dx*w/2,y+dy*h/2,z+dz*d/2];if(shape==='sphere'){for(let axis=0;axis<3;axis++){let pts=[];for(let k=0;k<=48;k++){let t=k*Math.PI/24;let v=[Math.cos(t),Math.sin(t),0];if(axis===1)v=[v[0],0,v[1]];if(axis===2)v=[0,v[0],v[1]];pts.push(p(...v))}line(pts)}}else if(shape==='cylinder'||shape==='rope'){for(let v of [-1,1]){let pts=[];for(let k=0;k<=36;k++){let t=k*Math.PI/18;pts.push(p(Math.cos(t),v,Math.sin(t)))}line(pts)}for(let t of [0,Math.PI/2,Math.PI,Math.PI*1.5])line([p(Math.cos(t),-1,Math.sin(t)),p(Math.cos(t),1,Math.sin(t))])}else{let verts=[p(-1,-1,-1),p(1,-1,-1),p(1,1,-1),p(-1,1,-1),p(-1,-1,1),p(1,-1,1),p(1,1,1),p(-1,1,1)];for(let [aa,bb] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])line([verts[aa],verts[bb]])}let label=project([x,y+h/2+.28,z]);ctx.fillStyle='#1b2a44';ctx.font='bold 16px system-ui';ctx.fillText(String(o.id||shape).slice(0,24),label[0]+5,label[1]-4)});}
 for(let [label,fn] of [['↶ Rotate',()=>yaw-=.3],['Rotate ↷',()=>yaw+=.3],['Tilt ↑',()=>pitch=Math.min(1.3,pitch+.2)],['Tilt ↓',()=>pitch=Math.max(-1.3,pitch-.2)],['＋',()=>zoom=Math.min(2.5,zoom*1.2)],['－',()=>zoom=Math.max(.5,zoom/1.2)]]){let b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=()=>{fn();draw()};controls.append(b)}
 canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
 let note=document.createElement('p');note.className='model-note';note.textContent='Rotate with your finger or the controls. This is a geometric preview of the lesson objects, not a generated 3D asset.';wrap.append(note);draw()}
$('load').onclick=load;$('learner').onchange=refresh;$('hint').onclick=()=>{if(!compiled)return;attempts++;$('feedback').textContent=attempts>=2?'Try a smaller movement, one part at a time.':'Watch the example carefully and try one small part first.'};$('reset').onclick=()=>{if(compiled)render()};$('complete').onclick=async()=>{if(!compiled)return;let finished=position>=compiled.activities.length-1;let next=finished?compiled.activities.length:position+1;try{await api('/progress',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({learner:$('learner').value,courseId:compiled.courseId,step:next,completed:Array.from({length:next},(_,i)=>i),score:next})});if(finished){$('feedback').textContent='Course complete! Your progress is saved.'}else{position=next;render()}}catch(e){$('feedback').textContent='Could not save: '+e.message}};refresh();
</script></html>
