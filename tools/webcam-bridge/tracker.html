<!doctype html>
<html><head><meta charset="utf-8"><title>GHOST hand tracker</title>
<style>
:root{--bg:#f4f1ea;--ink:#1c1b19;--muted:#8a857b;--rule:#d8d2c6;--accent:#b3261e}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:720px;margin:24px auto;padding:0 16px}
h1{font-weight:500;font-size:18px;margin:0 0 4px}
p{margin:0;color:var(--muted)}
.wrap{position:relative;margin-top:16px;border-top:1px solid var(--rule);padding-top:16px}
video,canvas{width:100%;display:block;transform:scaleX(-1)}
canvas{position:absolute;left:0;top:16px}
#stat{margin-top:10px;font-variant-numeric:tabular-nums}
</style></head><body><main>
<h1>GHOST hand tracker</h1>
<p>Keep this tab open while you test in Lens Studio. Pinch thumb and index finger to paint.</p>
<div class="wrap"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div id="coach" style="margin-top:14px;font-size:22px;color:#b3261e;min-height:28px"></div>
<div id="stat">starting</div>
</main>
<script type="module">
import {FilesetResolver, HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const coachEl=document.getElementById('coach'); const v=document.getElementById('v'), c=document.getElementById('c'), g=c.getContext('2d'), stat=document.getElementById('stat');
// Pinch is measured relative to hand size, so it works near or far from the camera.
// Measured on this rig: open hand ~1.25, pinched 0.10-0.14 (gap as a fraction
// of hand size). 0.30/0.55 sits well clear of both, with hysteresis between.
// Thresholds are the USER'S measured numbers: open hand ~1.25, pinched
// 0.10-0.14, so start below 0.30 and release above 0.55. The wide gap is
// deliberate stability, and the frame debounce below is what adds strictness
// -- narrowing these instead would make a steady pinch drop out mid-stroke.
const PINCH_ON=0.30, PINCH_OFF=0.55;
// One Euro filter: smooth when the hand is slow, responsive when it moves fast.
class OneEuro{constructor(minCut=0.5,beta=0.004,dCut=1.0){this.minCut=minCut;this.beta=beta;this.dCut=dCut;this.x=null;this.dx=0;this.t=null}
 a(c,dt){const r=2*Math.PI*c*dt;return r/(r+1)}
 f(x,t){if(this.x===null){this.x=x;this.t=t;return x}const dt=Math.max(1e-3,(t-this.t)/1000);this.t=t;
  const dx=(x-this.x)/dt;this.dx=this.dx+this.a(this.dCut,dt)*(dx-this.dx);const c=this.minCut+this.beta*Math.abs(this.dx);
  const nx=this.x+this.a(c,dt)*(x-this.x);
  // ignore tiny wobbles (hand tremor) below ~2 px at 640 wide
  if(Math.abs(nx-this.x)>0.0015) this.x=nx; return this.x}}
const filt={};
function smooth(side,i,v,t){const k=side+i;if(!filt[k])filt[k]=new OneEuro();return filt[k].f(v,t)}
let lastHands=[], lastSeen=-1e9, prevTip=null, pinchOn=false, pinchCnt=0; let ws=null, open=false, pinching={}, cnt={}, lenses=0;
const lastDbg=[null];
function connect(){ ws=new WebSocket('ws://127.0.0.1:8765'); ws.onopen=()=>{open=true; ws.send('source')}; ws.onclose=()=>{open=false; setTimeout(connect,1000)}; ws.onerror=()=>{}; }
connect();
setInterval(async()=>{try{lenses=(await (await fetch('/status')).json()).lenses}catch(e){}},1000);
const fileset=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const lm=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:0.6,minHandPresenceConfidence:0.6,minTrackingConfidence:0.5});
v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:540},frameRate:{ideal:60,min:24}}});
await v.play(); c.width=v.videoWidth; c.height=v.videoHeight;
let last=performance.now(), fps=0, lastT=-1;
function loop(){
  const t=performance.now();
  if(v.currentTime!==lastT){ lastT=v.currentTime;
    const r=lm.detectForVideo(v,t); const hands=[];
    g.clearRect(0,0,c.width,c.height);
    if(!(r.landmarks||[]).length) lastDbg[0]=null;
    const all=r.landmarks||[];
    // Pick ONE hand: the one whose index tip is nearest the centre, sticking with
    // the previous pick if it is still close. Only this hand is tracked and sent,
    // so another hand (or a mislabelled left/right) can never trigger a pinch.
    let pick=-1, best=1e9;
    all.forEach((pts,i)=>{const x=1-pts[8].x,y=pts[8].y;
      let score=Math.hypot(x-0.5,y-0.5);
      if(prevTip&&Math.hypot(x-prevTip[0],y-prevTip[1])<0.15) score-=0.5;
      if(score<best){best=score;pick=i}});
    all.forEach((pts,i)=>{
      g.fillStyle=i===pick?'#1c1b19':'#b8b2a6'; pts.forEach(q=>{g.beginPath();g.arc(q.x*c.width,q.y*c.height,i===pick?3:2,0,7);g.fill()});
    });
    if(pick>=0){
      const pts=all[pick];
      prevTip=[1-pts[8].x,pts[8].y];
      const p=pts.map((q,j)=>[+smooth('P',j*3,1-q.x,t).toFixed(4),+smooth('P',j*3+1,q.y,t).toFixed(4),+q.z.toFixed(4)]);
      const handSize=Math.hypot(pts[0].x-pts[9].x,pts[0].y-pts[9].y)||0.1;
      // 3D thumb-index gap as a fraction of palm length. Open hand ~1.2, pinch ~0.1.
      const d=Math.hypot(pts[4].x-pts[8].x,pts[4].y-pts[8].y,(pts[4].z-pts[8].z)*0.6)/handSize;
      // Strict and steady: start only when clearly pinched for 4 frames,
      // end when clearly open for 2 frames.
      const want=pinchOn? d<PINCH_OFF : d<PINCH_ON;
      pinchCnt=(want!==pinchOn)?pinchCnt+1:0;
      if((!pinchOn&&pinchCnt>=4)||(pinchOn&&pinchCnt>=2)){pinchOn=want;pinchCnt=0}
      const bx=(p[4][0]+p[8][0])/2, by=(p[4][1]+p[8][1])/2;
      p[8]=[+bx.toFixed(4),+by.toFixed(4),p[8][2]];
      hands.push({side:'Primary',pinch:pinchOn,pinchDist:+d.toFixed(4),points:p});
      lastDbg[0]={d,p:pinchOn,n:all.length};
      g.strokeStyle=pinchOn?'#b3261e':'#ffffff'; g.lineWidth=3; g.beginPath(); g.arc(pts[8].x*c.width,pts[8].y*c.height,10,0,7); g.stroke();
    } else { prevTip=null; if(performance.now()-lastSeen>200){pinchOn=false;pinchCnt=0} }
    // Grace period: if the hand drops out for a moment mid-stroke, resend the last
    // hand for up to 200 ms instead of reporting "no hand", so strokes don't break.
    const nowMs=performance.now();
    if(hands.length){lastHands=hands;lastSeen=nowMs}
    const out=hands.length?hands:(nowMs-lastSeen<150?lastHands:[]);
    // Simple coaching for the user
    let coach='';
    if(!hands.length&&nowMs-lastSeen>600) coach='Raise one hand into view, palm facing the camera';
    else if(hands.length){const p=hands[0].points;const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);
      const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
      if(Math.max(w,h)>0.6) coach='Too close, move your hand back';
      else if(Math.max(w,h)<0.12) coach='Too far, bring your hand a little closer';
      else if(Math.min(...xs)<0.03||Math.max(...xs)>0.97||Math.min(...ys)<0.03||Math.max(...ys)>0.97) coach='Keep your whole hand in the frame';}
    coachEl.textContent=coach;
    if(open) ws.send(JSON.stringify({t:Date.now()/1000,hands:out}));
    fps=0.9*fps+0.1*(1000/Math.max(1,t-last)); last=t;
  }
  // Live pinch readout: the number is the thumb-to-index gap as a fraction of
  // hand size. Watch it open vs pinched to choose thresholds from real values.
  const dbg=lastDbg[0];
  const pinchTxt=dbg?`  ·  pinch ${dbg.p?'DOWN':'up'} ${dbg.d.toFixed(3)}${dbg.n>1?`  ·  ${dbg.n} HANDS`:''}`:'  ·  no hand';
  stat.textContent=`${fps.toFixed(0)} fps  ·  relay ${open?'connected':'connecting'}  ·  lenses ${lenses}${pinchTxt}`;
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
